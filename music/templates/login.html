{% extends "base.html" %}
{% block title %}Login — Emotion Radar{% endblock %}
{% block content %}
<div style="min-height: 72vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px;">
  <div class="hud-panel" style="width: 100%; max-width: 400px;">
    <span class="hud-label">AUTH.LOGIN</span>
    <h2 style="font-size: 30px; margin-bottom: 24px; text-align: center;" class="cursor">ACCESS TERMINAL</h2>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="field-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Log In</button>
    </form>

    <p style="text-align: center; margin-top: 22px; color: var(--text-dim); font-size: 13.5px;">
      No account? <a href="{% url 'signup' %}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
